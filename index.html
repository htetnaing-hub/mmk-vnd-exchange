<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MMK ⇄ VND Exchange</title>
    <meta
      name="description"
      content="Convert between Myanmar Kyat (MMK) and Vietnamese Dong (VND) through USDT using Binance P2P rates, with service-fee comparison."
    />
    <meta name="theme-color" content="#f3f5f8" />
    <meta property="og:title" content="MMK ⇄ VND Exchange" />
    <meta property="og:description" content="Myanmar Kyat ⇄ Vietnamese Dong calculator through USDT using Binance P2P rates." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />

    <!-- Home-screen app on iPhone / iPad -->
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MMK ⇄ VND" />
    <!-- Content runs under the status bar; the top bar is dark in app mode so the white status text stays readable. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('mmk-vnd:theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
