<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MMK to VND Exchange</title>
    <meta
      name="description"
      content="Convert Myanmar Kyat (MMK) to Vietnamese Dong (VND) through USDT using Binance P2P rates, with service-fee comparison."
    />
    <meta name="theme-color" content="#f3f5f8" />
    <meta property="og:title" content="MMK to VND Exchange" />
    <meta property="og:description" content="Myanmar Kyat → USDT → Vietnamese Dong calculator using Binance P2P rates." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('mmk-vnd:theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
