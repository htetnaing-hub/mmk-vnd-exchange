<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed app icon: iOS and Android apply their own corner masks.
       Everything important stays inside the central 80% "safe zone". -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a2c"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- MMK coin -->
  <circle cx="176" cy="256" r="104" fill="#f5b301"/>
  <g stroke="#4a3500" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M138 204 V308"/>
    <path d="M204 204 L144 262"/>
    <path d="M164 246 L208 308"/>
  </g>

  <!-- VND coin, overlapping -->
  <circle cx="336" cy="256" r="104" fill="#da251d" stroke="#0f4a47" stroke-width="12"/>
  <g stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="338" cy="268" r="26"/>
    <path d="M364 198 V294"/>
    <path d="M344 218 H384"/>
    <path d="M306 324 H382"/>
  </g>
</svg>

